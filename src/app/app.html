<main class="content">
  <nav
    class="navbar sticky-top navbar-expand-md bg-body-tertiary"
    style="box-shadow: 0 4px 8px rgba(0, 0, 0, 0.4);
           background-color: rgb(255, 243, 212) !important"
  >
    <div class="container-fluid">

      <!-- Brand -->
      <a class="navbar-brand ms-lg-4 pe-2">
        <i>riddara</i>DB
      </a>

      <!-- Hamburger button: visible on smaller screens -->
      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#mainNavbar"
        aria-controls="mainNavbar"
        aria-expanded="false"
        aria-label="Toggle navigation"
      >
        <span class="navbar-toggler-icon"></span>
      </button>

      <!-- Collapsible navigation -->
      <div class="collapse navbar-collapse" id="mainNavbar">
        <ul class="navbar-nav w-100 mb-2 mb-lg-0">

          <li class="nav-item pe-2">
            <a class="nav-link"
               routerLink="/home"
               routerLinkActive="active"
               (click)="closeNavbar()">
               <span>Home</span></a>
          </li>

          <li class="nav-item pe-2">
            <a class="nav-link"
               routerLink="/about"
               routerLinkActive="active"
               (click)="closeNavbar()">About</a>
          </li>

          <!-- Separator -->
          <li class="nav-item d-none d-md-flex align-items-center pe-2">
            <span><b>|</b></span>
          </li>

          <li class="nav-item pe-2">
            <a class="nav-link"
               routerLink="/sagas"
               routerLinkActive="active"
               (click)="closeNavbar()">Sagas</a>
          </li>

          <li class="nav-item pe-2">
            <a class="nav-link"
               routerLink="/bib"
               routerLinkActive="active"
               (click)="closeNavbar()">Bibliography</a>
          </li>

          <li class="nav-item pe-2">
            <a class="nav-link"
               routerLink="/ms"
               routerLinkActive="active"
               (click)="closeNavbar()">Manuscripts</a>
          </li>

          <!-- Separator -->
          <li class="nav-item d-none d-md-flex align-items-center pe-2">
            <span><b>|</b></span>
          </li>

          <li class="nav-item pe-2">
            <a class="nav-link"
               routerLink="/motifs"
               routerLinkActive="active"
               (click)="closeNavbar()">Motifs</a>
          </li>

          <li class="nav-item pe-2">
            <a class="nav-link"
               routerLink="/characters"
               routerLinkActive="active"
               (click)="closeNavbar()">Characters</a>
          </li>

          <li class="nav-item pe-2">
            <a class="nav-link"
               routerLink="/locations"
               routerLinkActive="active"
               (click)="closeNavbar()">Locations</a>
          </li>

          @if ($isAdmin()) {
            <li class="nav-item ms-lg-auto">
              <a class="nav-link"
                 routerLink="/admin"
                 routerLinkActive="active"
                 (click)="closeNavbar()">Admin</a>
            </li>
          }

          <li class="nav-item me-lg-3"
              [class.ms-lg-auto]="!$isAdmin()">
            @if ($loggedIn()) {
              <a class="nav-link"
                 href="#"
                 (click)="logout(); $event.preventDefault(); closeNavbar()">Log&nbsp;out</a>
            } @else {
              <a class="nav-link"
                 routerLink="/login"
                 routerLinkActive="active"
                 (click)="closeNavbar()">Log&nbsp;in</a>
            }
          </li>

        </ul>
      </div>

    </div>
  </nav>

  <router-outlet />
</main>

  <footer class="page-footer">
    <div class="card-body">
      <div class="container-fluid ms-4">
        <div class="row">
          <div class="col">
            Placeholder text
          </div>
        </div>
      </div>

    </div>
  </footer>
